<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estante · Entrar</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='estante.ico') }}">
</head>
<body class="login-body">
  <main class="login-wrap">
    <form class="login-card" method="post" action="{{ url_for('login') }}">
      <h1 class="brand"> <img src="{{ url_for('static', filename='estante.png') }}" alt="" class="brand-logo">Estante</h1>
      <p class="login-subtitle">Digite a senha para acessar a biblioteca.</p>

      <input type="hidden" name="next" value="{{ next or '' }}">
      <input
        class="login-input"
        type="password"
        name="password"
        placeholder="Senha"
        autofocus
        autocomplete="current-password"
      >

      {% if error %}
      <p class="login-error">{{ error }}</p>
      {% endif %}

      <button class="login-button" type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
